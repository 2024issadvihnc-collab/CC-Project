
name: Deploy ShowTime Frontend to AWS EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend (EC2 Instance 1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          role-session-name: GitHubActions-DeployFrontend

      - name: Deploy Frontend
        env:
          FRONTEND_INSTANCE_ID: ${{ secrets.AWS_FRONTEND_EC2_INSTANCE_ID }}
        run: |
          set -e

          COMMAND="cd /home/ec2-user/ShowTime && \
            git fetch origin && \
            git checkout main && \
            git pull --ff-only origin main && \
            docker compose -f docker-compose.frontend.yml up -d --build"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$FRONTEND_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$COMMAND\"]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Frontend deployment failed."
            exit 1
          fi

      - name: Verify Frontend Health
        env:
          FRONTEND_INSTANCE_ID: ${{ secrets.AWS_FRONTEND_EC2_INSTANCE_ID }}
        run: |
          set -e

          CHECK_CMD="curl --retry 5 --retry-delay 5 --retry-connrefused -fsSI http://localhost"

          CHECK_ID=$(aws ssm send-command \
            --instance-ids "$FRONTEND_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$CHECK_CMD\"]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CHECK_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CHECK_ID" \
            --instance-id "$FRONTEND_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Frontend health check failed."
            exit 1
          fi

          echo "Frontend health check passed."
